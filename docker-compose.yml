services:

  minio:
    image: minio/minio:latest
    container_name: sit-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - sit-net

  minio-init:
    image: minio/mc:latest
    container_name: sit-minio-init
    depends_on:
      - minio
    networks:
      - sit-net
    entrypoint: /bin/sh
    command: >
      -c "
      sleep 10 &&
      mc alias set sitminio http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing sitminio/report-staging-raw &&
      mc mb --ignore-existing sitminio/report-staging-watermarked &&
      mc mb --ignore-existing sitminio/report-archive &&
      echo Buckets created
      "

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: sit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sit-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sit-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: sit
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      - minio
      - minio-init
      - rabbitmq
    networks:
      - sit-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sit-frontend
    ports:
      - "8880:80"
    depends_on:
      - backend
    networks:
      - sit-net

volumes:
  minio-data:

networks:
  sit-net:
    driver: bridge
